<!doctype html>
<html lang="en">
  <head>

    <title>Home-screen icon</title>

      html, body { margin: 0; background: #050505; }
      .icon { width: 180px; height: 180px; display: grid; place-items: center;
        background: radial-gradient(closest-side, #1a0609, #050505); }

      <svg viewBox="21 22 156 156" width="128" height="128">
        <path fill="#ff2d3d" fill-rule="evenodd" d="M24 44L92 44L120 72L120 128L92 156L24 156ZM48 68L48 132L84 132L96 120L96 80L84 68Z" />
        <path fill="#ff2d3d" d="M97.66 44L174.34 44L174.34 68L148 68L148 156L124 156L124 68L121.66 68Z" />
      </svg>
    </div>
  </body>
</html>
