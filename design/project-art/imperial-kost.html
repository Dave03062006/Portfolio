<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Imperial Kost illustration</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="./art.css" />
  </head>
  <body>
    <!-- Imperial Kost: the website, with the floor plan + 360° view (left) and the interactive map (right) -->
    <svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="far" />
          <feMerge><feMergeNode in="far" /><feMergeNode in="near" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ff1f35" stop-opacity="0.16" />
          <stop offset="1" stop-color="#ff1f35" stop-opacity="0" />
        </radialGradient>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0H0V50" fill="none" stroke="#141418" stroke-width="1.5" />
        </pattern>
        <radialGradient id="fadeGrad" cx="0.5" cy="0.5" r="0.62">
          <stop offset="0.35" stop-color="#fff" />
          <stop offset="1" stop-color="#000" />
        </radialGradient>
        <mask id="fade"><rect width="1600" height="1000" fill="url(#fadeGrad)" /></mask>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="#ff2d3d" />
        </marker>
        <clipPath id="map"><rect x="800" y="230" width="490" height="530" rx="10" /></clipPath>
      </defs>

      <rect width="1600" height="1000" fill="#060607" />
      <rect width="1600" height="1000" fill="url(#grid)" mask="url(#fade)" />
      <ellipse cx="800" cy="480" rx="640" ry="420" fill="url(#haze)" />
      <path class="soft" d="M40 80V40H80M1520 40H1560V80M40 920V960H80M1560 920V960H1520" />
      <text class="fig" x="100" y="955">FIG. 03.3 · IMPERIAL KOST · NEXT.JS</text>

      <!-- Browser window -->
      <rect x="280" y="150" width="1040" height="640" rx="18" fill="#0b0b0d" stroke="#3a3a40" stroke-width="2" />
      <line x1="280" y1="200" x2="1320" y2="200" stroke="#1f1f24" stroke-width="2" />
      <circle cx="310" cy="175" r="6" fill="#2a2a2f" />
      <circle cx="332" cy="175" r="6" fill="#2a2a2f" />
      <circle cx="354" cy="175" r="6" fill="#2a2a2f" />
      <rect x="500" y="162" width="600" height="26" rx="13" fill="#0e0e11" stroke="#26262b" />
      <text class="tiny" x="800" y="180" text-anchor="middle">imperialf7.vercel.app</text>

      <!-- Floor plan: nine rooms, A to I -->
      <rect x="330" y="250" width="140" height="160" fill="#ff2d3d" fill-opacity="0.1" />
      <g stroke="#4a4a52" stroke-width="2">
        <line x1="470" y1="250" x2="470" y2="730" />
        <line x1="610" y1="250" x2="610" y2="730" />
        <line x1="330" y1="410" x2="750" y2="410" />
        <line x1="330" y1="570" x2="750" y2="570" />
      </g>
      <rect x="330" y="250" width="420" height="480" fill="none" stroke="#8a8a92" stroke-width="3" />
      <g class="soft" style="stroke: #3a3a40">
        <path d="M470 380A26 26 0 0 1 444 406" />
        <path d="M610 540A26 26 0 0 0 636 566" />
        <path d="M470 700A26 26 0 0 0 496 726" />
      </g>
      <rect x="330" y="250" width="140" height="160" fill="none" stroke="#ff2d3d" stroke-width="2.5" filter="url(#glow)" />
      <g class="tiny">
        <text x="344" y="278" style="fill: #ff4d5b">A</text>
        <text x="484" y="278">B</text>
        <text x="624" y="278">C</text>
        <text x="344" y="438">D</text>
        <text x="484" y="438">E</text>
        <text x="624" y="438">F</text>
        <text x="344" y="598">G</text>
        <text x="484" y="598">H</text>
        <text x="624" y="598">I</text>
      </g>
      <!-- 360° view badge in room A -->
      <path d="M400 305A30 30 0 1 1 374 320" fill="none" stroke="#ff2d3d" stroke-width="2.5" marker-end="url(#arrow)" />
      <text class="tiny" x="400" y="340" text-anchor="middle" style="fill: #ff4d5b">360°</text>

      <!-- Interactive map -->
      <rect x="800" y="230" width="490" height="530" rx="10" fill="#0d0d10" stroke="#1f1f24" stroke-width="2" />
      <g clip-path="url(#map)">
        <g stroke="#17171b" stroke-width="16" stroke-linecap="round">
          <path d="M790 362L1300 302" />
          <path d="M790 602L1300 652" />
          <path d="M930 220L880 770" />
          <path d="M1150 220L1200 770" />
        </g>
        <g stroke="#141418" stroke-width="6">
          <path d="M790 482L1300 472" />
          <path d="M1040 220L1050 770" />
        </g>
        <!-- Routes from the kost to nearby landmarks -->
        <path d="M1030 452L916 314" class="dash" />
        <path d="M1062 450L1196 352" class="dash" />
        <path d="M1056 500L1164 676" class="dash" />
        <!-- The kost -->
        <circle cx="1045" cy="495" r="46" fill="none" stroke="#ff2d3d" stroke-opacity="0.25" stroke-width="2" />
        <circle cx="1045" cy="495" r="26" fill="none" stroke="#ff2d3d" stroke-opacity="0.5" stroke-width="2" />
        <path d="M1045 500C1045 500 1015 465 1015 445A30 30 0 1 1 1075 445C1075 465 1045 500 1045 500Z" fill="#ff2d3d" filter="url(#glow)" />
        <circle cx="1045" cy="445" r="10" fill="#0d0d10" />
        <!-- Landmarks -->
        <g fill="#0d0d10" stroke="#8a8a92" stroke-width="2">
          <rect x="885" y="285" width="30" height="30" rx="5" />
          <rect x="1195" y="325" width="30" height="30" rx="5" />
          <rect x="1155" y="675" width="30" height="30" rx="5" />
        </g>
        <g class="tiny" text-anchor="middle" style="fill: #d6d6db">
          <text x="900" y="305">U</text>
          <text x="1210" y="345">M</text>
          <text x="1170" y="695">+</text>
        </g>
        <g class="note" text-anchor="middle" style="font-size: 15px">
          <text x="900" y="270">750 M</text>
          <text x="1210" y="310">3.5 KM</text>
          <text x="1170" y="736">3.9 KM</text>
        </g>
        <!-- Zoom controls -->
        <g fill="#0e0e11" stroke="#2a2a2f">
          <rect x="1252" y="246" width="24" height="24" rx="4" />
          <rect x="1252" y="272" width="24" height="24" rx="4" />
        </g>
        <path d="M1258 258H1270M1264 252V264M1258 284H1270" stroke="#8a8a92" stroke-width="2" />
      </g>

      <!-- Captions -->
      <text class="label" x="540" y="842" text-anchor="middle" style="fill: #d6d6db">ROOMS + 360° VIEWS</text>
      <text class="note" x="540" y="870" text-anchor="middle">nine rooms, four types</text>
      <text class="label" x="1045" y="842" text-anchor="middle">INTERACTIVE MAP</text>
      <text class="note" x="1045" y="870" text-anchor="middle">directions to landmarks</text>
    </svg>
  </body>
</html>
