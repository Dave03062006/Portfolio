<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ALP_VP illustration</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="./art.css" />
  </head>
  <body>
    <!-- ALP_VP: the Android app, the reward flow (left) and the backend (right) -->
    <svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="far" />
          <feMerge><feMergeNode in="far" /><feMergeNode in="near" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ff1f35" stop-opacity="0.16" />
          <stop offset="1" stop-color="#ff1f35" stop-opacity="0" />
        </radialGradient>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0H0V50" fill="none" stroke="#141418" stroke-width="1.5" />
        </pattern>
        <radialGradient id="fadeGrad" cx="0.5" cy="0.5" r="0.62">
          <stop offset="0.35" stop-color="#fff" />
          <stop offset="1" stop-color="#000" />
        </radialGradient>
        <mask id="fade"><rect width="1600" height="1000" fill="url(#fadeGrad)" /></mask>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="#ff2d3d" />
        </marker>
      </defs>

      <rect width="1600" height="1000" fill="#060607" />
      <rect width="1600" height="1000" fill="url(#grid)" mask="url(#fade)" />
      <ellipse cx="800" cy="480" rx="640" ry="420" fill="url(#haze)" />
      <path class="soft" d="M40 80V40H80M1520 40H1560V80M40 920V960H80M1560 920V960H1520" />
      <text class="fig" x="100" y="955">FIG. 03.1 · ALP_VP · FULL STACK</text>

      <!-- Phone -->
      <rect class="line" x="650" y="140" width="300" height="700" rx="46" />
      <rect x="668" y="176" width="264" height="628" rx="28" fill="#0e0e11" stroke="#1f1f24" />
      <circle cx="800" cy="196" r="6" fill="#1f1f24" stroke="#2a2a2f" />
      <rect x="950" y="300" width="5" height="70" rx="2" fill="#3a3a40" />

      <!-- Screen: spending per game -->
      <text class="tiny" x="692" y="242">SPENDING · THIS MONTH</text>
      <line x1="692" y1="470" x2="908" y2="470" stroke="#26262b" stroke-width="2" />
      <rect x="696" y="360" width="28" height="110" rx="4" fill="#1b1b20" stroke="#3a3a40" />
      <rect x="739" y="310" width="28" height="160" rx="4" fill="#1b1b20" stroke="#3a3a40" />
      <rect x="782" y="390" width="28" height="80" rx="4" fill="#1b1b20" stroke="#3a3a40" />
      <rect x="825" y="270" width="28" height="200" rx="4" fill="#ff2d3d" fill-opacity="0.16" stroke="#ff2d3d" stroke-width="2" filter="url(#glow)" />
      <rect x="868" y="340" width="28" height="130" rx="4" fill="#1b1b20" stroke="#3a3a40" />
      <g fill="none" stroke="#4a4a52" stroke-width="2">
        <rect x="703" y="484" width="14" height="14" rx="3" />
        <rect x="746" y="484" width="14" height="14" rx="3" />
        <rect x="789" y="484" width="14" height="14" rx="3" />
        <rect x="832" y="484" width="14" height="14" rx="3" stroke="#ff2d3d" />
        <rect x="875" y="484" width="14" height="14" rx="3" />
      </g>

      <!-- Screen: points ring -->
      <circle cx="742" cy="600" r="44" fill="none" stroke="#26262b" stroke-width="9" />
      <path d="M742 556A44 44 0 1 1 698 600" fill="none" stroke="#ff2d3d" stroke-width="9" stroke-linecap="round" filter="url(#glow)" />
      <text class="tiny" x="742" y="605" text-anchor="middle" style="fill: #ff4d5b">PTS</text>
      <rect x="808" y="572" width="100" height="8" rx="4" fill="#2a2a2f" />
      <rect x="808" y="596" width="74" height="8" rx="4" fill="#2a2a2f" />
      <rect x="808" y="620" width="88" height="8" rx="4" fill="#2a2a2f" />

      <!-- Screen: redeem button and nav dots -->
      <rect x="692" y="700" width="216" height="48" rx="24" fill="#ff2d3d" fill-opacity="0.08" stroke="#ff2d3d" stroke-width="2" />
      <text class="tiny" x="800" y="729" text-anchor="middle" style="fill: #ff4d5b">REDEEM</text>
      <circle cx="720" cy="782" r="5" fill="#ff2d3d" />
      <circle cx="773" cy="782" r="5" fill="#2a2a2f" />
      <circle cx="827" cy="782" r="5" fill="#2a2a2f" />
      <circle cx="880" cy="782" r="5" fill="#2a2a2f" />

      <!-- Rewards: gacha capsule and voucher -->
      <path d="M648 600C560 600 500 380 402 352" class="dash" marker-end="url(#arrow)" />
      <path d="M648 724C560 724 520 600 446 578" class="dash" marker-end="url(#arrow)" />
      <!-- gacha capsule: a clear top with the prize inside, a solid bottom -->
      <path d="M270 360V332A60 60 0 0 1 390 332V360Z" fill="#ff2d3d" fill-opacity="0.16" />
      <path d="M270 360V388A60 60 0 0 0 390 388V360Z" fill="#141418" />
      <path d="M330 302L334.1 312.3L345.2 313.1L336.7 320.2L339.4 330.9L330 325L320.6 330.9L323.3 320.2L314.8 313.1L325.9 312.3Z" fill="#ff2d3d" filter="url(#glow)" />
      <rect x="270" y="272" width="120" height="176" rx="60" fill="none" stroke="#d6d6db" stroke-width="2.5" />
      <line x1="270" y1="360" x2="390" y2="360" stroke="#d6d6db" stroke-width="1.5" />
      <path d="M288 318A44 44 0 0 1 300 296" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round" />
      <line x1="330" y1="452" x2="330" y2="506" class="dash" marker-end="url(#arrow)" />
      <path class="line" d="M244 516H416A14 14 0 0 1 430 530V552A14 14 0 0 0 430 580V602A14 14 0 0 1 416 616H244A14 14 0 0 1 230 602V580A14 14 0 0 0 230 552V530A14 14 0 0 1 244 516Z" />
      <line x1="310" y1="526" x2="310" y2="606" stroke="#3a3a40" stroke-width="2" stroke-dasharray="4 6" />
      <text class="tiny" x="370" y="558" text-anchor="middle">VOUCHER</text>
      <text class="label" x="370" y="592" text-anchor="middle" style="font-size: 24px">−20%</text>
      <text class="label" x="330" y="690" text-anchor="middle">GACHA + VOUCHERS</text>
      <text class="note" x="330" y="718" text-anchor="middle">points turn into rewards</text>

      <!-- Backend: API server and database -->
      <line x1="955" y1="345" x2="1150" y2="345" class="dash" marker-end="url(#arrow)" />
      <line x1="1150" y1="385" x2="963" y2="385" class="dash" marker-end="url(#arrow)" />
      <text class="tiny" x="1056" y="328" text-anchor="middle">HTTPS · JSON</text>
      <rect class="line" x="1160" y="290" width="220" height="150" rx="14" />
      <g fill="none" stroke="#3a3a40" stroke-width="2">
        <rect x="1180" y="310" width="180" height="26" rx="6" />
        <rect x="1180" y="347" width="180" height="26" rx="6" />
        <rect x="1180" y="384" width="180" height="26" rx="6" />
      </g>
      <circle cx="1196" cy="323" r="4" fill="#ff2d3d" filter="url(#glow)" />
      <circle cx="1196" cy="360" r="4" fill="#3a3a40" />
      <circle cx="1196" cy="397" r="4" fill="#3a3a40" />
      <g stroke="#26262b" stroke-width="2">
        <line x1="1300" y1="323" x2="1348" y2="323" />
        <line x1="1300" y1="360" x2="1348" y2="360" />
        <line x1="1300" y1="397" x2="1348" y2="397" />
      </g>
      <line x1="1255" y1="446" x2="1255" y2="506" class="dash" marker-end="url(#arrow)" />
      <line x1="1285" y1="510" x2="1285" y2="452" class="dash" marker-end="url(#arrow)" />
      <path class="line" d="M1174 540V680A96 24 0 0 0 1366 680V540" />
      <ellipse cx="1270" cy="540" rx="96" ry="24" fill="#121216" stroke="#d6d6db" stroke-width="2.5" />
      <path d="M1174 587A96 24 0 0 0 1366 587M1174 634A96 24 0 0 0 1366 634" class="soft" />
      <text class="label" x="1270" y="760" text-anchor="middle">API + DATABASE</text>
      <text class="note" x="1270" y="788" text-anchor="middle">TypeScript · Prisma</text>

      <!-- Phone caption -->
      <text class="label" x="800" y="892" text-anchor="middle">ANDROID APP</text>
      <text class="note" x="800" y="920" text-anchor="middle">Kotlin · spending per game</text>
    </svg>
  </body>
</html>
